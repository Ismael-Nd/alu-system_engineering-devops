<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Ceci n'est pas une page</title>
  <style>
    :root {
      --wall: #ece4d4;
      --frame: #6b4a2b;
      --frame-light: #a07a4f;
      --canvas: #f6efdd;
      --ink: #2b2118;
      --muted: #7a6a58;
      --accent: #b0412e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: radial-gradient(circle at 50% 20%, #f7f1e5 0%, var(--wall) 60%, #ddd2bd 100%);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
    }

    .lamp {
      width: 140px;
      height: 14px;
      margin-bottom: 18px;
      border-radius: 0 0 70px 70px;
      background: #3a3a3a;
      box-shadow: 0 30px 80px 40px rgba(255, 236, 190, 0.55);
    }

    .frame {
      width: min(560px, 100%);
      padding: 22px;
      background: linear-gradient(135deg, var(--frame-light), var(--frame) 40%, #4a3220);
      border-radius: 4px;
      box-shadow: 0 25px 45px rgba(43, 33, 24, 0.35), inset 0 0 0 3px rgba(255, 255, 255, 0.12);
    }

    .canvas {
      padding: 40px 24px 32px;
      background: var(--canvas);
      box-shadow: inset 0 0 25px rgba(107, 74, 43, 0.25);
    }

    .code {
      font-size: clamp(88px, 22vw, 150px);
      font-weight: bold;
      line-height: 1;
      letter-spacing: 6px;
      color: var(--ink);
      animation: float 4s ease-in-out infinite;
    }

    .code span {
      color: var(--accent);
    }

    h1 {
      margin-top: 22px;
      font-size: clamp(22px, 5vw, 32px);
      font-style: italic;
      font-weight: normal;
    }

    .plaque {
      display: inline-block;
      margin-top: 28px;
      padding: 10px 22px;
      background: linear-gradient(#d9b86a, #b08d3f);
      border-radius: 3px;
      color: #3b2a12;
      font-size: 13px;
      letter-spacing: 1px;
      box-shadow: 0 4px 10px rgba(43, 33, 24, 0.3);
    }

    p {
      max-width: 460px;
      margin-top: 30px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 28px;
      border: 2px solid var(--ink);
      color: var(--ink);
      font-size: 15px;
      letter-spacing: 2px;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s, color 0.2s;
    }

    a:hover,
    a:focus {
      background: var(--ink);
      color: var(--canvas);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .code { animation: none; }
    }
  </style>
</head>
<body>
  <div class="lamp" aria-hidden="true"></div>
  <div class="frame">
    <div class="canvas">
      <div class="code">4<span>0</span>4</div>
      <h1>Ceci n'est pas une page</h1>
    </div>
  </div>
  <div class="plaque">LA TRAHISON DES URLS &mdash; 404</div>
  <p>
    What you are looking at is not the page you were looking for.
    It is only a picture of a missing page.
  </p>
  <a href="/">Back to the gallery</a>
</body>
</html>
